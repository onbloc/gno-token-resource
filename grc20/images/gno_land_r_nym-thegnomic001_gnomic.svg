<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gnomic">
  <title>Gnomic</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="64%">
      <stop offset="0%" stop-color="#fff7e0"/>
      <stop offset="58%" stop-color="#f7e5b6"/>
      <stop offset="100%" stop-color="#e4c684"/>
    </radialGradient>
    <linearGradient id="hat" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#e45a4e"/>
      <stop offset="55%" stop-color="#c8342c"/>
      <stop offset="100%" stop-color="#8f1a16"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#749a49"/>
      <stop offset="100%" stop-color="#3f5c2a"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#ece5d4"/>
      <stop offset="100%" stop-color="#cdc4ae"/>
    </linearGradient>
  </defs>

  <!-- the disc -->
  <circle cx="32" cy="32" r="30.5" fill="url(#bg)" stroke="#3b2a15" stroke-width="2.4"/>

  <!-- the woven nest behind him: short strokes leaning round the rim, which
       at this size reads as basketwork where full arcs read as a rainbow -->
  <g stroke="#c8922f" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M9.5 38 C8 26 14 16 24 12" stroke-width="2.6"/>
    <path d="M54.5 38 C56 26 50 16 40 12" stroke-width="2.6"/>
    <g stroke-width="1.7" opacity=".75">
      <path d="M12 44 C10 33 15 23 23 18"/>
      <path d="M52 44 C54 33 49 23 41 18"/>
    </g>
    <g stroke-width="1.2" opacity=".45">
      <path d="M14.5 45 C13 34 17 25 24 20.5"/>
      <path d="M49.5 45 C51 34 47 25 40 20.5"/>
    </g>
  </g>

  <!-- crossed legs, boots at the ends -->
  <path d="M16.5 51.5 C21 46.5 43 46.5 47.5 51.5 C43 55.5 21 55.5 16.5 51.5 Z" fill="#41719e"/>
  <path d="M16.5 51.5 C21 49.2 43 49.2 47.5 51.5 C43 53.2 21 53.2 16.5 51.5 Z" fill="#33608a" opacity=".5"/>
  <ellipse cx="18.8" cy="52" rx="5.2" ry="3.5" fill="#4a3018"/>
  <ellipse cx="45.2" cy="52" rx="5.2" ry="3.5" fill="#4a3018"/>

  <!-- the coat, wide enough that the green is part of him and not a collar -->
  <path d="M32 29 C21 29 15.5 37 15.5 49 C21.5 52 42.5 52 48.5 49 C48.5 37 43 29 32 29 Z" fill="url(#coat)"/>
  <!-- sleeves, running down to where the hands meet -->
  <path d="M17.5 41 C19 46 23 49.5 28.5 47 L27 43 C23 44.5 19.5 43.5 18.5 40 Z" fill="#5d7f39"/>
  <path d="M46.5 41 C45 46 41 49.5 35.5 47 L37 43 C41 44.5 44.5 43.5 45.5 40 Z" fill="#5d7f39"/>

  <!-- the beard: narrower than the coat, so both are legible -->
  <path d="M32 25 C23 25 20.6 31.5 21.6 37.6 C22.6 43.4 27 46.5 32 46.5 C37 46.5 41.4 43.4 42.4 37.6 C43.4 31.5 41 25 32 25 Z" fill="url(#beard)"/>
  <path d="M25.4 27.6 C27.6 31.2 36.4 31.2 38.6 27.6 C37.2 32.4 26.8 32.4 25.4 27.6 Z" fill="#ffffff"/>

  <!-- face -->
  <path d="M23.6 22 C23.6 28.6 27.4 31.6 32 31.6 C36.6 31.6 40.4 28.6 40.4 22 Z" fill="#f1c9a5"/>

  <!-- the hat, leaning as it does in the drawing -->
  <path d="M32.6 2.6 C27.4 7.4 22.6 14.6 21.2 20.4 C24.8 22.6 39.4 22.6 43 20.4 C41.6 14.6 37.4 7.4 32.6 2.6 Z" fill="url(#hat)"/>
  <path d="M21 19.6 C24.6 22 39.6 22 43.2 19.6 C43.8 21.2 43.6 22.6 42.8 23.2 C38.6 25 25.6 25 21.4 23.2 C20.6 22.6 20.4 21.2 21 19.6 Z" fill="#7d1512"/>

  <!-- hands pressed together, in front of the beard where they belong.
       Narrow, and low: any wider and they read as a leaf lying on the beard. -->
  <path d="M32 35.4 C30.2 38.4 30 43.4 32 47.6 C34 43.4 33.8 38.4 32 35.4 Z"
        fill="#f6d5b1" stroke="#a9794f" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M32 37 L32 46.4" stroke="#c99a6f" stroke-width=".45" opacity=".55"/>
  <path d="M30.5 44.6 C31.5 45.6 32.5 45.6 33.5 44.6" fill="none" stroke="#a9794f" stroke-width=".55"/>

  <!-- sunglasses last: nothing may cover them -->
  <rect x="23" y="23.4" width="18" height="5.4" rx="2.6" fill="#16151b"/>
  <rect x="24.4" y="24.6" width="6.3" height="2.9" rx="1.45" fill="#43434f"/>
  <rect x="33.3" y="24.6" width="6.3" height="2.9" rx="1.45" fill="#43434f"/>
</svg>
